
<!DOCTYPE html>
<html lang="en"> <!-- Ensure no 'dark' class here by default; JS will manage it -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Alt Text Generator</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Explicitly configure Tailwind CSS for class-based dark mode
    tailwind.config = {
      darkMode: 'class',
      // You can add other theme extensions here if needed in the future.
      // theme: {
      //   extend: {
      //     colors: {},
      //   },
      // },
    };
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    :root {
      --scrollbar-track: #e2e8f0; /* slate-200 for light */
      --scrollbar-thumb: #94a3b8; /* slate-400 for light */
      --scrollbar-thumb-hover: #64748b; /* slate-500 for light */
    }

    html.dark {
      --scrollbar-track: #1e293b; /* slate-800 for dark */
      --scrollbar-thumb: #334155; /* slate-700 for dark */
      --scrollbar-thumb-hover: #475569; /* slate-600 for dark */
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
  </style>
  <script type="importmap">
    {
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.0.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.0.1",
    "react/": "https://esm.sh/react@^19.0.0/",
    "react": "https://esm.sh/react@^19.0.0",
    "react-dom": "https://esm.sh/react-dom@^19.0.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
  <div id="root"></div>
  <div id="toast-root"></div>
  <div id="modal-root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
